pluginManagement {
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

	repositories {
		google()
		mavenCentral()
		maven {
			url("https://developer.huawei.com/repo/")
			content {
				includeGroup("com.huawei.hms")
			}
		}
	}
}

rootProject.name = "origin-android"
include(
	":origin",
	":origin-adcom",
	":origin-ads",
	":origin-antifraud",
	":origin-core",
	":origin-crypt",
	":origin-gppstring",
	":origin-javac-plugin",
	":origin-msasdk-stub",
	":origin-protobuf",
	":origin-util"
)
