plugins {
	id("origin-library")
	alias(libs.plugins.protobuf)
}

description = "AdCOM definitions specialized for Android."

dependencies {
	api(project(":origin-protobuf"))
	api(libs.androidx.core)
	implementation(project(":origin-util"))

	androidTestImplementation(libs.protobuf.lite)
}

protobuf {
	generateProtoTasks {
		all().configureEach {
			enabled = false
		}

		ofTest().configureEach {
			enabled = true
			builtins {
				java {
					option("lite")
				}
			}
		}
	}
}
