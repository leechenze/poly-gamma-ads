	AdSlotLast			= -1;

	/// First ad in pod.
	AdSlotFirst			= 1;

	/// First or last ad in pod.
	AdSlotFirstOrLast	= 2;
}

/// Enumeration of substitutable ad tracker URL macro types.
enum AdTrackerUrlMacroType {
	/// Unknown macro.
	AdTrackerUrlMacroUnknown					=  0;

	/// Random 8-digit integer.
	AdTrackerUrlMacroCacheBust					=  1;

	/// ISO 8601 formatted timestamp of when tracker was fired.
	AdTrackerUrlMacroTimestamp					=  2;

	/// Limit ad tracking.
	///
	/// A value of `1` if limit ad tracking has been requested; otherwise, `0`.
	AdTrackerUrlMacroLmt						=  3;

	/// Comma delimited list of applicable regulations.
	AdTrackerUrlMacroRegs						=  4;

	/// Base-64 GDPR consent string.
	AdTrackerUrlMacroGdprConsent				=  5;

	/// GPP consent string.
	AdTrackerUrlMacroGppString					=  6;

	/// Comma delimited list of applicable GPP section identifiers.
	AdTrackerUrlMacroGppSectionIds				=  7;

	/// App store assigned identifier of app for which tracker is being fired.
	AdTrackerUrlMacroAppStoreId					=  8;

	/// App store URL of app for which tracker is being fired.
	AdTrackerUrlMacroAppStoreUrl				=  9;

	/// Bundle identifier of app for which tracker is being fired.
	AdTrackerUrlMacroAppBundle					= 10;

	/// Top-level domain name of website for which tracker is being fired.
	AdTrackerUrlMacroSiteDomain					= 11;

	/// URL of website page for which tracker is being fired.
	AdTrackerUrlMacroSitePageUrl				= 12;

	/// Number of ads that have been executed, including current ad, by placement for an ad break.
	AdTrackerUrlMacroExecutedAdCount			= 13;

	/// Type of ad tracker is being fired for.
	///
	/// Substitution value may be `audio`, `display`, or `video`.
	AdTrackerUrlMacroAdType						= 14;

	/// Duration, in seconds, of ad break.
	AdTrackerUrlMacroAdBreakDuration			= 15;

	/// Position of ad break within underlying content.
	///
	/// For playback content, this may be `1`, `2`, or `3` for pre, mid, or post -roll,
	/// respectively. Otherwise, `0` or `4` for none/other or standalone, respectively.
	AdTrackerUrlMacroAdBreakPosition			= 16;

	/// Playhead position, formatted as `HH:MM:SS.mmm`, of underlying playback content.
	AdTrackerUrlMacroContentPlayhead			= 17;

	/// Placement type.
	AdTrackerUrlMacroPlacementType				= 18;

	/// Identifier of transaction from which ad was sourced.
	AdTrackerUrlMacroTransactionId				= 19;

	/// Comma delimited list of universal ad identifiers.
	///
	/// Each universal ad identifier is formatted from the identifier registry and identifier
	/// value, respectively, delimited with a space.
	AdTrackerUrlMacroUniversalAdId				= 20;

	/// User-agent string of media player used to play playback media.
	///
	/// Formatted as `<player-name>/<player-version> <sdk-name>/<sdk-version>`
	AdTrackerUrlMacroMediaPlayerUa				= 21;

	/// IP address of device on which tracker is fired.
	AdTrackerUrlMacroDeviceIp					= 22;

	/// User-agent string of device on which tracker is fired.
	AdTrackerUrlMacroDeviceUa					= 23;

	/// Advertising sanctioned identifier of device on which tracker is fired.
	AdTrackerUrlMacroDeviceIfa					= 24;

	/// Advertising sanctioned identifier type of device on which tracker is fired.
	AdTrackerUrlMacroDeviceIfaType				= 25;

	/// Latitude and longitude, delimited by comma, of end user.
	AdTrackerUrlMacroGeoLatLon					= 26;

	/// Tracker is fired on client or server -side.
	///
	/// Value of `0`, `1`, or `2` may be used to represent client-side, server-side firing on
	/// behalf of client device, or server-side firing on behalf of another server.
	AdTrackerUrlMacroServerSide					= 27;

	/// User-agent string of server.
	///
	/// Formatted as `<server-name>/<server-version> (<server-vendor-url>)`
	AdTrackerUrlMacroServerUa					= 28;

	/// Supported clickthrough mode.
	///
	/// This may be `0`, `1`, `2`, or `3` for no click support, entire placement is clickable,
	/// placement has a clickable button, or placement allows clicking with a confirmation dialog,
	/// respectively.
	AdTrackerUrlMacroClickType					= 29;

	/// Supported OMID partner identifier.
	///
	/// Formatted as `<partner-name>/<partner-version>`.
	AdTrackerUrlMacroOmidPartner				= 30;

	/// Comma delimited list of media player, used for playback media, capabilities.
	///
	/// Each element in list must be `skip`, `mute`, `autoplay`, `mautoplay`, `fullscreen`, or
	/// `icon` for player allows skipping, muting, unmuted autoplay, muted autoplay, full-screen,
	/// and icon rendering, respectively.
	AdTrackerUrlMacroMediaPlayerCaps			= 31;

	/// Playback ad media playhead position, formatted as `HH:MM:SS.mmm`.
	AdTrackerUrlMacroAdPlayhead					= 32;

	/// Serving identifier of currently executing ad.
	///
	/// This is formatted as `<server-name>-<serve-id>`.
	AdTrackerUrlMacroAdServeId					= 33;

	/// URL of ad asset currently being executed.
	AdTrackerUrlMacroAdAssetUrl					= 34;

	/// Comma delimited list of ad state.
	///
	/// Each item must be one of `skippable`, `autoplayed`, `mautoplayed`, or `optin` for
	/// whether ad can be skipped, is autoplayed, is autoplayed without audio, or user interaction
	/// is required to start playback, respectively.
	AdTrackerUrlMacroAdState					= 35;

	/// Width and height, delimited by comma, of ad as currently executed.
	AdTrackerUrlMacroAdSize						= 36;

	/// Comma delimited states of media player, rendering currently executing ad.
	///
	/// Each item must be either `muted` or `fullscreen` for whether playback is muted or player
	/// is taking over full screen of device, respectively.
	AdTrackerUrlMacroMediaPlayerState			= 37;

	/// X and Y coordinates, delimited by comma, of where ad was activated.
	AdTrackerUrlMacroClickPosition				= 38;

	/// Code describing error encountered while executing current ad.
	AdTrackerUrlMacroAdErrorCode				= 39;

	/// Code describing error encountered while executing an event tracker.
	AdTrackerUrlMacroAdEventTrackerErrorCode	= 40;
}

