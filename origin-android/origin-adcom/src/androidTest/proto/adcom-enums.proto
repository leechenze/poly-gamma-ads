syntax="proto3";
package org.polygamma.origin.adcom;

/// Enumeration of activation (i.e. click) behaviors.
enum ActivationBehavior {
	/// Ad media cannot be activated.
	ActivationNone				= 0;

	/// Ad media can be activated and behavior is unknown.
	ActivationUnknown			= 1;

	/// Activating ad media results in embedded browser being opened.
	ActivationEmbeddedBrowser	= 2;

	/// Activating ad media results in native browser being opened.
	ActivationNativeBrowser		= 3;
}

/// Enumeration of advertising API codes.
enum AdApiCode {
	/// Unknown advertising API.
	AdApiUnknown	= 0;

	/// VPAID, version 1.0.
	AdApiVpaid10	= 1;

	/// VPAID, version 2.0.
	AdApiVpaid20	= 2;

	/// MRAID, version 1.0.
	AdApiMraid10	= 3;

	/// ORMMA.
	AdApiOrmma		= 4;

	/// MRAID, version 2.0.
	AdApiMraid20	= 5;

	/// MRAID, version 3.0.
	AdApiMraid30	= 6;

	/// OMID, version 1.0.
	AdApiOmid10		= 7;

	/// SIMID, version 1.0.
	AdApiSimid10	= 8;

	/// SIMID, version 1.1.
	AdApiSimid11	= 9;
}

/// Enumeration of ad audit status codes.
enum AdAuditStatusCode {
	/// Unknown audit status.
	AdAuditStatusUnknown		= 0;

	/// Audit pending.
	AdAuditStatusPending		= 1;

	/// Audit pending, but ad is recommended for use.
	AdAuditStatusPreapproved	= 2;

	/// Audit complete and ad is approved for use.
	AdAuditStatusApproved		= 3;

	/// Audit complete and ad is denied for use.
	AdAuditStatusDenied		= 4;

	/// Ad has materially changed and audit must be reperformed.
	AdAuditStatusChanged		= 5;

	/// Audit has expired.
	AdAuditStatusExpired		= 6;
}

enum AdErrorCode {
	// These are tied 1-1 with vast error codes. Custom codes go in 10000+.

	/// No error.
	AdErrorNone							= 0;

	reserved 100; // parsing error
	reserved 101; // schema validation error
	reserved 102; // response version not supported

	/// Unsupported ad type.
	AdErrorUnsupportedType				= 200;

	/// Unsupported ad linearity.
	AdErrorUnsupportedLinearity			= 201;

	/// Playback ad duration is unsupported.
	AdErrorUnsupportedDuration			= 202;

	/// Ad size is unsupported.
	AdErrorUnsupportedSize				= 203;

	/// Ad does not specify categories.
	AdErrorCatMissing					= 204;

	reserved 205; // inline category violates wrapper BlockedAdCategories

	/// Ad was not served due to non-erroneous reason.
	AdErrorIgnored						= 206;

	reserved 300; // general wrapper error
	reserved 301; // wrapper uri timeout
	reserved 302; // wrapper limit reached
	reserved 303; // no vast response after one or more wrappers

	/// Ad failed to render within timeout.
	AdErrorRenderTimeout				= 304;

	/// General playback ad error.
	AdErrorPlayback						= 400;

	/// Playback ad media file not found.
	AdErrorPlaybackMediaNotFound		= 401;

	/// Playback ad media file timed out.
	AdErrorPlaybackMediaTimeout			= 402;

	/// No supported playback file was found.
	AdErrorUnsupportedPlaybackMedia		= 403;

	reserved 404;

	/// Failed to render playback ad file.
	AdErrorPlaybackMediaError			= 405;

	reserved 406;
	reserved 407;
	reserved 408;

	/// Interactive asset of a playback ad was not executed.
	AdErrorPlaybackInteractiveIgnored	= 409;

	reserved 410;
	reserved 411;

	/// General error while executing overlay creative of a playback ad.
	AdErrorPlaybackOverlay				= 500;

	/// Overlay creative size does not fit.
	AdErrorPlaybackOverlaySize			= 501;

	/// Failed to fetch overlay creative asset.
	AdErrorPlaybackOverlayFetch			= 502;

	/// Supported overlay creative was not found.
	AdErrorUnsupportedPlaybackOverlay	= 503;

	/// General error while executing companion ad.
	AdErrorCompanion					= 600;

	/// Companion ad size does not fit.
	AdErrorCompanionSize				= 601;

	/// Error while rendering companion ad.
	AdErrorCompanionRender				= 602;

	/// Failed to fetch companion ad assets.
	AdErrorCompanionFetch				= 603;

	/// Supported companion ad was not found.
	AdErrorUnsupportedCompanion			= 604;

	/// An undefined error.
	AdErrorUndefined					= 900;

	reserved 901;

	/// General error while executing interactive creative.
	AdErrorPlaybackInteractive			= 902;

	/// General error while executing display ad.
	AdErrorDisplay						= 10000;

	/// Failed to fetch display ad assets.
	AdErrorDisplayFetch					= 10001;

	/// Failed to load display ad.
	AdErrorDisplayLoad					= 10002;
}

/// Enumeration of ad event tracker error codes.
enum AdEventTrackerErrorCode {
	// These are tied 1-1 with vast verification error codes.

	/// Unknown error code.
	AdEventTrackerErrorNone			= 0;

	/// Tracker URL was rejected.
	AdEventTrackerErrorRejected		= 1;

	/// Tracker type is not supported.
	AdEventTrackerErrorUnsupported	= 2;

	/// Tracker failed to load.
	AdEventTrackerErrorLoad			= 3;
}

/// Enumeration of ad media event types.
enum AdEventType {
	/// Unknown event type.
	AdEventUnknown					= 0;

	/// Ad media has loaded.
	AdEventLoaded					= 1;

	/// Ad media has received an impression.
	AdEventImpression				= 2;

	/// Ad media was 50% in view for 1 continuous second.
	AdEventViewableMrc50			= 3;

	/// Ad media was 100% in view for 1 continuous second.
	AdEventViewableMrc100			= 4;

	/// Ad media was 50% in view for 2 continuous seconds.
	AdEventViewableVideo50			= 5;

	/// Error encountered while executing ad media.
	AdEventError					= 500;

	/// Ad media was not selected for execution.
	AdEventIgnored					= 501;

	/// Ad media received impression but viewability was undetermined for the lifetime of its
	/// execution.
	AdEventViewUndetermined			= 502;

	/// Ad media received impression but was not viewable for the lifetime of its execution.
	AdEventNotViewable				= 503;

	/// Non-navigable asset of ad media activated (i.e. clicked).
	AdEventActivated				= 504;

	/// Navigable asset of ad media activated (i.e. clicked).
	AdEventActivatedLink			= 505;

	/// Ad media was interacted (non-activation) with by user.
	AdEventInteracted				= 506;

	/// User activated skip button to skip creative.
	AdEventSkipped					= 507;

	/// User activated mute button on media player, used to playback ad media, and creative was
	/// muted.
	AdEventMediaPlayerMuted			= 508;

	/// User activated unmute button on media player, used to playback ad media, and creative was
	/// unmuted.
	AdEventMediaPlayerUnmuted		= 509;

	/// User activated pause button on media player, used to playback ad media, and creative
	/// playback was paused.
	AdEventMediaPlayerPaused		= 510;

	/// User activated resume button on media player, used to playback ad media, and creative
	/// playback was resumed.
	AdEventMediaPlayerUnpaused		= 511;

	/// User activated rewind controls on media player, used to playback ad media, and creative
	/// playhead was moved to an earlier point.
	AdEventMediaPlayerRewind		= 512;

	/// User activated expand controls on media player, used to playback ad media.
	AdEventMediaPlayerExpand		= 513;

	/// User activated collapse controls on media player, used to playback ad media.
	AdEventMediaPlayerCollapse		= 514;

	/// Playback ad media progress.
	AdEventPlaybackProgress			= 515;

	/// User activated controls to terminate ad media playback.
	AdEventPlaybackTerminated		= 516;

	/// Interactive asset of a playback ad was started.
	AdEventPlaybackInteractiveStart	= 517;

	/// User activated control used to pause streaming content, which either expands the ad overlay
	/// within the media player's viewable area or takes over streaming content area by launching
	/// an additional portion of the overlay creative.
	AdEventPlaybackOverlayAccept	= 518;

	/// Time that initial ad is displayed.
	AdEventPlaybackOverlayViewDur	= 519;

	/// User activated control to expand display or playback overlay ad.
	AdEventExpanded					= 520;

	/// User activated control to collapse display or playback overlay ad.
	AdEventCollapsed				= 521;

	/// User activated control to minimize display or playback overlay ad.
	AdEventMinimized				= 522;

	/// User activated control to close display or playback overlay ad.
	AdEventClosed					= 523;
}

/// Enumeration of ad media event tracker types.
enum AdEventTrackerType {
	/// Unknown tracker type.
	AdEventTrackerUnknown				= 0;

	/// Image pixel tracker.
	AdEventTrackerPixel					= 1;

	/// JavaScript tracker.
	AdEventTrackerJavaScript			= 2;

	/// JavaScript tracker which may be executed within a restricted sandbox.
	AdEventTrackerJavaScriptSandbox		= 500;
}

/// Enumeration of ad linearity modes.
enum AdLinearityMode {
